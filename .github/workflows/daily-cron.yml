name: Daily Wallpaper Auto Import

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes (48 times a day)
  workflow_dispatch:

jobs:
  auto-import:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Import Cron API
        run: |
          curl -X GET "https://ai-wallpaper-website.vercel.app/api/cron/auto-import?secret=ai-wallpaper-secret-key&count=30"